name: ViboCodium CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build IDevice.xcframework, JITBridge, and the app (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Vendor/idevice/target
          key: macos-idevice-cargo-ios-${{ hashFiles('Vendor/idevice/Cargo.lock') }}
          restore-keys: macos-idevice-cargo-ios-

      # We only ever target a real iOS device, so this builds just the
      # aarch64-apple-ios slice instead of idevice's own `just xcframework`
      # recipe (which also builds simulator/Catalyst/macOS - unnecessary for
      # us, and most of the CI time). See scripts/build-idevice-xcframework.sh.
      - name: Build IDevice.xcframework (aarch64-apple-ios only)
        run: ./scripts/build-idevice-xcframework.sh

      - name: Upload IDevice.xcframework
        uses: actions/upload-artifact@v4
        with:
          name: idevice-xcframework
          path: Vendor/idevice/swift/IDevice.xcframework

      - name: Build JITBridge
        working-directory: Modules/JITBridge
        run: xcodebuild build -scheme JITBridge -destination 'generic/platform=iOS'

      - name: Install XcodeGen
        run: brew install xcodegen

      # App/ViboCodium.xcodeproj is generated, not checked in - see
      # App/project.yml and Makefile's app-project/app-build targets.
      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate

      # Unsigned compile verification only - no signing identity exists in
      # CI (or anywhere yet). Real device installs go through the
      # SideSign-based signing pipeline, not an exported/signed archive
      # built here.
      - name: Build ViboCodium app (unsigned)
        working-directory: App
        run: |
          xcodebuild build -project ViboCodium.xcodeproj -scheme ViboCodium \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
